<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAK FARM ACCOUNT</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,"Noto Sans Thai",sans-serif;
background:#f2f4f7;
color:#222;
}

header{
background:linear-gradient(135deg,#111,#343434);
color:white;
padding:16px;
position:sticky;
top:0;
z-index:10;
}

.header{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:23px;
font-weight:bold;
}

.logo span{
color:#ff8500;
}

.container{
max-width:1200px;
margin:auto;
padding:15px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-bottom:18px;
}

.stat{
background:white;
border-radius:15px;
padding:17px;
box-shadow:0 3px 12px #0001;
}

.stat-title{
font-size:14px;
color:#777;
}

.stat-value{
font-size:25px;
font-weight:bold;
margin-top:7px;
}

.red{color:#d62828}
.green{color:#16833a}
.orange{color:#e87500}
.blue{color:#1769aa}

.tabs{
display:flex;
gap:7px;
overflow-x:auto;
margin-bottom:15px;
}

.tab{
background:white;
border:0;
padding:11px 15px;
border-radius:10px;
white-space:nowrap;
cursor:pointer;
}

.tab.active{
background:#ff7a00;
color:white;
}

.section{
display:none;
}

.section.active{
display:block;
}

.panel{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:18px;
box-shadow:0 3px 12px #0001;
}

.panel h2{
margin-top:0;
}

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

label{
display:block;
font-size:14px;
margin-bottom:5px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:9px;
font-size:15px;
}

button{
border:0;
border-radius:9px;
padding:10px 14px;
font-weight:bold;
cursor:pointer;
}

.btn{
background:#ff7a00;
color:white;
}

.btn-green{
background:#198754;
color:white;
}

.btn-red{
background:#dc3545;
color:white;
}

.btn-blue{
background:#1769aa;
color:white;
}

.btn-dark{
background:#222;
color:white;
}

.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.item-card{
border:1px solid #eee;
border-radius:14px;
padding:15px;
background:#fff;
box-shadow:0 2px 8px #0000000d;
}

.item-card h3{
margin:0 0 10px;
}

.info{
display:flex;
justify-content:space-between;
padding:6px 0;
border-bottom:1px solid #f0f0f0;
font-size:14px;
}

.info:last-child{
border-bottom:0;
}

.actions{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-top:12px;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
font-size:12px;
}

.paid{
background:#d8f5df;
color:#167331;
}

.debt{
background:#ffe0e0;
color:#a00000;
}

.empty{
padding:35px;
text-align:center;
color:#999;
background:#fafafa;
border-radius:12px;
}

.detail-box{
line-height:1.8;
}

.modal{
position:fixed;
inset:0;
background:#0008;
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:100;
}

.modal.show{
display:flex;
}

.modal-content{
background:white;
width:100%;
max-width:500px;
border-radius:18px;
padding:22px;
max-height:90vh;
overflow:auto;
}

@media(max-width:800px){

.dashboard{
grid-template-columns:repeat(2,1fr);
}

.cards{
grid-template-columns:1fr;
}

.form-grid{
grid-template-columns:1fr;
}

}

@media(max-width:500px){

.container{
padding:10px;
}

.stat{
padding:12px;
}

.stat-value{
font-size:20px;
}

.panel{
padding:14px;
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
NAK <span>FARM</span> ACCOUNT
</div>

<div id="dateNow"></div>

</div>

</header>

<div class="container">

<!-- DASHBOARD -->

<div class="dashboard">

<div class="stat">
<div class="stat-title">💰 ยอดหนี้</div>
<div class="stat-value red" id="dashDebt">฿0</div>
</div>

<div class="stat">
<div class="stat-title">💵 รับเงินแล้ว</div>
<div class="stat-value green" id="dashPaid">฿0</div>
</div>

<div class="stat">
<div class="stat-title">📈 รายรับ</div>
<div class="stat-value blue" id="dashIncome">฿0</div>
</div>

<div class="stat">
<div class="stat-title">💸 ค่าใช้จ่าย</div>
<div class="stat-value orange" id="dashExpense">฿0</div>
</div>

</div>

<!-- MENU -->

<div class="tabs">

<button class="tab active" onclick="openTab('home',this)">
📊 ภาพรวม
</button>

<button class="tab" onclick="openTab('customer',this)">
👨‍🌾 ลูกค้า
</button>

<button class="tab" onclick="openTab('job',this)">
🚜 งานรับจ้าง
</button>

<button class="tab" onclick="openTab('fuel',this)">
⛽ น้ำมัน
</button>

<button class="tab" onclick="openTab('money',this)">
💰 การเงิน
</button>

<button class="tab" onclick="openTab('payment',this)">
📱 ชำระเงิน
</button>

</div>


<!-- HOME -->

<div id="home" class="section active">

<div class="panel">

<h2>📊 ภาพรวมกิจการ</h2>

<div id="homeSummary"></div>

</div>

<div class="panel">

<h2>🕐 รายการล่าสุด</h2>

<div id="latestList"></div>

</div>

</div>


<!-- CUSTOMER -->

<div id="customer" class="section">

<div class="panel">

<h2>👨‍🌾 เพิ่มลูกค้า</h2>

<div class="form-grid">

<div>
<label>ชื่อลูกค้า</label>
<input id="cName" placeholder="เช่น นายสมชาย">
</div>

<div>
<label>เบอร์โทร</label>
<input id="cPhone" placeholder="08xxxxxxxx">
</div>

<div>
<label>ที่อยู่</label>
<input id="cAddress" placeholder="บ้าน/ตำบล">
</div>

<div>
<label>หมายเหตุ</label>
<input id="cNote" placeholder="หมายเหตุ">
</div>

</div>

<br>

<button class="btn" onclick="addCustomer()">
+ เพิ่มลูกค้า
</button>

</div>

<div class="panel">

<h2>📋 รายชื่อลูกค้า</h2>

<div id="customerList" class="cards"></div>

</div>

</div>


<!-- JOB -->

<div id="job" class="section">

<div class="panel">

<h2>🚜 เพิ่มงานรับจ้าง</h2>

<div class="form-grid">

<div>
<label>ลูกค้า</label>
<select id="jCustomer"></select>
</div>

<div>
<label>วันที่</label>
<input type="date" id="jDate">
</div>

<div>
<label>ประเภทงาน</label>
<select id="jType">
<option>เกี่ยวข้าว</option>
<option>ไถนา</option>
<option>ดำนา</option>
<option>หว่านข้าว</option>
<option>ขนข้าว</option>
<option>อื่นๆ</option>
</select>
</div>

<div>
<label>จำนวนไร่</label>
<input type="number" id="jRai">
</div>

<div>
<label>ราคา/ไร่</label>
<input type="number" id="jPrice">
</div>

<div>
<label>รับเงินแล้ว</label>
<input type="number" id="jPaid" value="0">
</div>

</div>

<br>

<button class="btn" onclick="addJob()">
+ บันทึกงาน
</button>

</div>

<div class="panel">

<h2>📋 งานรับจ้างทั้งหมด</h2>

<div id="jobList" class="cards"></div>

</div>

</div>


<!-- FUEL -->

<div id="fuel" class="section">

<div class="panel">

<h2>⛽ บันทึกน้ำมัน</h2>

<div class="form-grid">

<div>
<label>วันที่</label>
<input type="date" id="fDate">
</div>

<div>
<label>เครื่องจักร</label>
<select id="fMachine">
<option>Kubota DC70G PRO</option>
<option>Kubota L5228</option>
<option>รถไถ</option>
<option>รถกระบะ</option>
<option>อื่นๆ</option>
</select>
</div>

<div>
<label>จำนวนลิตร</label>
<input type="number" id="fLiter">
</div>

<div>
<label>ราคาต่อลิตร</label>
<input type="number" id="fPrice">
</div>

</div>

<br>

<button class="btn" onclick="addFuel()">
+ บันทึกน้ำมัน
</button>

</div>

<div class="panel">

<h2>⛽ รายการน้ำมัน</h2>

<div id="fuelList" class="cards"></div>

</div>

</div>


<!-- MONEY -->

<div id="money" class="section">

<div class="panel">

<h2>💰 รายรับ / รายจ่าย</h2>

<div class="form-grid">

<div>
<label>วันที่</label>
<input type="date" id="mDate">
</div>

<div>
<label>ประเภท</label>

<select id="mType">

<option value="income">
รายรับ
</option>

<option value="expense">
รายจ่าย
</option>

</select>

</div>

<div>
<label>รายการ</label>
<input id="mDetail" placeholder="เช่น ค่าซ่อมรถ">
</div>

<div>
<label>จำนวนเงิน</label>
<input type="number" id="mAmount">
</div>

</div>

<br>

<button class="btn" onclick="addMoney()">
+ บันทึกรายการ
</button>

</div>

<div class="panel">

<h2>📋 รายการการเงิน</h2>

<div id="moneyList" class="cards"></div>

</div>

</div>


<!-- PAYMENT -->

<div id="payment" class="section">

<div class="panel">

<h2>📱 บันทึกการชำระเงิน</h2>

<div class="form-grid">

<div>
<label>ลูกค้า</label>
<select id="pCustomer"></select>
</div>

<div>
<label>จำนวนเงิน</label>
<input type="number" id="pAmount">
</div>

</div>

<br>

<button class="btn-green" onclick="addPayment()">
✓ บันทึกการชำระ
</button>

</div>

<div class="panel">

<h2>💳 ประวัติการชำระ</h2>

<div id="paymentList" class="cards"></div>

</div>

</div>

</div>


<!-- DETAIL MODAL -->

<div id="detailModal" class="modal">

<div class="modal-content">

<h2 id="modalTitle"></h2>

<div id="modalBody"></div>

<br>

<button class="btn-dark"
onclick="closeModal()">
ปิด
</button>

</div>

</div>


<script>

/* =========================
DATA
========================= */

let customers =
JSON.parse(localStorage.getItem("nak_customers")||"[]");

let jobs =
JSON.parse(localStorage.getItem("nak_jobs")||"[]");

let fuels =
JSON.parse(localStorage.getItem("nak_fuels")||"[]");

let money =
JSON.parse(localStorage.getItem("nak_money")||"[]");

let payments =
JSON.parse(localStorage.getItem("nak_payments")||"[]");


function save(){

localStorage.setItem(
"nak_customers",
JSON.stringify(customers)
);

localStorage.setItem(
"nak_jobs",
JSON.stringify(jobs)
);

localStorage.setItem(
"nak_fuels",
JSON.stringify(fuels)
);

localStorage.setItem(
"nak_money",
JSON.stringify(money)
);

localStorage.setItem(
"nak_payments",
JSON.stringify(payments)
);

render();

}


function today(){

return new Date()
.toISOString()
.substring(0,10);

}


function baht(n){

return "฿"+Number(n||0)
.toLocaleString("th-TH");

}


/* =========================
TAB
========================= */

function openTab(id,btn){

document
.querySelectorAll(".section")
.forEach(x=>x.classList.remove("active"));

document
.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

btn.classList.add("active");

}


/* =========================
CUSTOMER
========================= */

function addCustomer(){

let name=
document.getElementById("cName").value.trim();

if(!name){

alert("กรุณากรอกชื่อลูกค้า");

return;

}

customers.push({

id:Date.now(),

name:name,

phone:document.getElementById("cPhone").value,

address:document.getElementById("cAddress").value,

note:document.getElementById("cNote").value

});

document.getElementById("cName").value="";
document.getElementById("cPhone").value="";
document.getElementById("cAddress").value="";
document.getElementById("cNote").value="";

save();

}


/* =========================
JOB
========================= */

function addJob(){

let cid=
Number(document.getElementById("jCustomer").value);

if(!cid){

alert("กรุณาเลือกลูกค้า");

return;

}

let rai=
Number(document.getElementById("jRai").value);

let price=
Number(document.getElementById("jPrice").value);

let paid=
Number(document.getElementById("jPaid").value)||0;

if(!rai||!price){

alert("กรุณากรอกจำนวนไร่และราคา");

return;

}

let total=rai*price;

jobs.push({

id:Date.now(),

customerId:cid,

date:
document.getElementById("jDate").value||today(),

type:
document.getElementById("jType").value,

rai:rai,

price:price,

total:total,

paid:paid,

debt:Math.max(total-paid,0)

});

save();

}


/* =========================
FUEL
========================= */

function addFuel(){

let liter=
Number(document.getElementById("fLiter").value);

let price=
Number(document.getElementById("fPrice").value);

if(!liter||!price){

alert("กรุณากรอกข้อมูลน้ำมัน");

return;

}

fuels.push({

id:Date.now(),

date:
document.getElementById("fDate").value||today(),

machine:
document.getElementById("fMachine").value,

liter:liter,

price:price,

total:liter*price

});

save();

}


/* =========================
MONEY
========================= */

function addMoney(){

let amount=
Number(document.getElementById("mAmount").value);

let detail=
document.getElementById("mDetail").value;

if(!amount||!detail){

alert("กรุณากรอกข้อมูลให้ครบ");

return;

}

money.push({

id:Date.now(),

date:
document.getElementById("mDate").value||today(),

type:
document.getElementById("mType").value,

detail:detail,

amount:amount

});

save();

}


/* =========================
PAYMENT
========================= */

function addPayment(){

let cid=
Number(document.getElementById("pCustomer").value);

let amount=
Number(document.getElementById("pAmount").value);

if(!cid||!amount){

alert("กรุณากรอกข้อมูลให้ครบ");

return;

}

payments.push({

id:Date.now(),

customerId:cid,

amount:amount,

date:today()

});


/* ตัดยอดหนี้จากงานเก่า */

let remaining=amount;

jobs
.filter(x=>
x.customerId===cid &&
x.debt>0
)
.forEach(j=>{

if(remaining<=0)return;

let cut=
Math.min(j.debt,remaining);

j.paid+=cut;

j.debt-=cut;

remaining-=cut;

});

save();

document.getElementById("pAmount").value="";

alert("บันทึกการชำระเงินเรียบร้อย");

}


/* =========================
DELETE
========================= */

function remove(type,id){

if(!confirm("ต้องการลบรายการนี้หรือไม่?"))
return;

if(type==="customer")
customers=
customers.filter(x=>x.id!==id);

if(type==="job")
jobs=
jobs.filter(x=>x.id!==id);

if(type==="fuel")
fuels=
fuels.filter(x=>x.id!==id);

if(type==="money")
money=
money.filter(x=>x.id!==id);

if(type==="payment")
payments=
payments.filter(x=>x.id!==id);

save();

}


/* =========================
EDIT
========================= */

function editCustomer(id){

let c=customers.find(x=>x.id===id);

if(!c)return;

let name=prompt("ชื่อลูกค้า",c.name);

if(name===null)return;

let phone=prompt("เบอร์โทร",c.phone||"");

c.name=name;

c.phone=phone;

save();

}


function editJob(id){

let j=jobs.find(x=>x.id===id);

if(!j)return;

let paid=prompt(
"จำนวนเงินที่ลูกค้าจ่ายแล้ว",
j.paid
);

if(paid===null)return;

paid=Number(paid);

j.paid=paid;

j.debt=
Math.max(j.total-paid,0);

save();

}


function editFuel(id){

let f=fuels.find(x=>x.id===id);

if(!f)return;

let liter=prompt(
"จำนวนลิตร",
f.liter
);

if(liter===null)return;

let price=prompt(
"ราคาต่อลิตร",
f.price
);

if(price===null)return;

f.liter=Number(liter);

f.price=Number(price);

f.total=f.liter*f.price;

save();

}


function editMoney(id){

let m=money.find(x=>x.id===id);

if(!m)return;

let detail=prompt(
"รายการ",
m.detail
);

if(detail===null)return;

let amount=prompt(
"จำนวนเงิน",
m.amount
);

if(amount===null)return;

m.detail=detail;

m.amount=Number(amount);

save();

}


/* =========================
DETAIL
========================= */

function detail(title,body){

document.getElementById("modalTitle")
.innerText=title;

document.getElementById("modalBody")
.innerHTML=body;

document.getElementById("detailModal")
.classList.add("show");

}


function closeModal(){

document
.getElementById("detailModal")
.classList.remove("show");

}


/* =========================
RENDER CUSTOMER
========================= */

function renderCustomers(){

let html="";

customers
.slice()
.reverse()
.forEach(c=>{

let cj=
jobs.filter(j=>j.customerId===c.id);

let debt=
cj.reduce((s,j)=>s+j.debt,0);

let paid=
cj.reduce((s,j)=>s+j.paid,0);

html+=`

<div class="item-card">

<h3>👨‍🌾 ${c.name}</h3>

<div class="info">
<span>📞 โทร</span>
<b>${c.phone||"-"}</b>
</div>

<div class="info">
<span>🚜 งาน</span>
<b>${cj.length} งาน</b>
</div>

<div class="info">
<span>💵 ชำระแล้ว</span>
<b class="green">${baht(paid)}</b>
</div>

<div class="info">
<span>🔴 ค้าง</span>
<b class="red">${baht(debt)}</b>
</div>

<div class="actions">

<button class="btn-blue"
onclick="showCustomer(${c.id})">
รายละเอียด
</button>

<button class="btn"
onclick="editCustomer(${c.id})">
แก้ไข
</button>

<button class="btn-red"
onclick="remove('customer',${c.id})">
ลบ
</button>

</div>

</div>

`;

});

document.getElementById("customerList").innerHTML=
html||
'<div class="empty">ยังไม่มีลูกค้า</div>';

}


/* =========================
CUSTOMER DETAIL
========================= */

function showCustomer(id){

let c=customers.find(x=>x.id===id);

let cj=jobs.filter(x=>x.customerId===id);

let debt=
cj.reduce((s,x)=>s+x.debt,0);

let paid=
cj.reduce((s,x)=>s+x.paid,0);

detail(
"👨‍🌾 "+c.name,

`

<div class="detail-box">

<p>📞 เบอร์โทร: <b>${c.phone||"-"}</b></p>

<p>📍 ที่อยู่: <b>${c.address||"-"}</b></p>

<p>📝 หมายเหตุ: ${c.note||"-"}</p>

<hr>

<p>🚜 จำนวนงาน: <b>${cj.length}</b></p>

<p>💵 ชำระแล้ว:
<b class="green">${baht(paid)}</b>
</p>

<p>🔴 ยอดค้าง:
<b class="red">${baht(debt)}</b>
</p>

</div>

`);

}


/* =========================
JOB RENDER
========================= */

function renderJobs(){

let html="";

jobs
.slice()
.reverse()
.forEach(j=>{

let c=
customers.find(x=>x.id===j.customerId);

html+=`

<div class="item-card">

<h3>🚜 ${j.type}</h3>

<div class="info">
<span>👨‍🌾 ลูกค้า</span>
<b>${c?.name||"-"}</b>
</div>

<div class="info">
<span>📅 วันที่</span>
<b>${j.date}</b>
</div>

<div class="info">
<span>🌾 พื้นที่</span>
<b>${j.rai} ไร่</b>
</div>

<div class="info">
<span>💰 ราคา</span>
<b>${baht(j.price)}/ไร่</b>
</div>

<div class="info">

/* =========================
DASHBOARD
========================= */

function renderDashboard(){

let debt=
jobs.reduce((s,x)=>s+x.debt,0);

let paid=
jobs.reduce((s,x)=>s+x.paid,0);

let income=
money
.filter(x=>x.type==="income")
.reduce((s,x)=>s+x.amount,0);

let expense=
money
.filter(x=>x.type==="expense")
.reduce((s,x)=>s+x.amount,0);

let fuelExpense=
fuels.reduce((s,x)=>s+x.total,0);

document.getElementById("dashDebt")
.innerText=baht(debt);

document.getElementById("dashPaid")
.innerText=baht(paid);

document.getElementById("dashIncome")
.innerText=baht(income+paid);

document.getElementById("dashExpense")
.innerText=baht(expense+fuelExpense);


document.getElementById("homeSummary").innerHTML=`

<div class="cards">

<div class="item-card">
<h3>👨‍🌾 ลูกค้า</h3>
<div class="stat-value blue">
${customers.length} ราย
</div>
</div>

<div class="item-card">
<h3>🚜 งานรับจ้าง</h3>
<div class="stat-value orange">
${jobs.length} งาน
</div>
</div>

<div class="item-card">
<h3>🌾 พื้นที่รับจ้าง</h3>
<div class="stat-value green">
${jobs.reduce((s,x)=>s+x.rai,0).toLocaleString()} ไร่
</div>
</div>

<div class="item-card">
<h3>⛽ น้ำมัน</h3>
<div class="stat-value orange">
${fuels.reduce((s,x)=>s+x.liter,0).toLocaleString()} ลิตร
</div>
</div>

</div>

<br>

<div class="item-card">

<h3>💵 เงินสุทธิ</h3>

<div class="stat-value ${
income+paid-expense-fuelExpense>=0
?"green":"red"
}">

${baht(income+paid-expense-fuelExpense)}

</div>

</div>

`;


let latest=[];

jobs.forEach(x=>{

let c=
customers.find(c=>c.id===x.customerId);

latest.push({

date:x.date,

text:`🚜 ${x.type} - ${c?.name||"-"}`,

amount:x.total

});

});

fuels.forEach(x=>{

latest.push({

date:x.date,

text:`⛽ ${x.machine}`,

amount:x.total

});

});

money.forEach(x=>{

latest.push({

date:x.date,

text:`${x.type==="income"?"📈":"📉"} ${x.detail}`,

amount:x.amount

});

});

latest.sort((a,b)=>
b.date.localeCompare(a.date)
);

document.getElementById("latestList")
.innerHTML=
latest.slice(0,10).map(x=>`

<div class="item-card" style="margin-bottom:8px">

<div class="info">

<span>
${x.text}
</span>

<b>
${baht(x.amount)}
</b>

</div>

<div>
<small>${x.date}</small>
</div>

</div>

`).join("")
||
'<div class="empty">ยังไม่มีรายการ</div>';

}
